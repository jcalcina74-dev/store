services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD en el entorno}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - store_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d store"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  store_postgres: