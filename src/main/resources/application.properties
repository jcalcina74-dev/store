# Configuracion local opcional, relativa al directorio de ejecucion.
spring.config.import=optional:file:./.env[extension=.properties][encoding=utf-8]
spring.application.name=procesos
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.flyway.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.tomcat.max-part-count=4
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.media-dir=${APP_MEDIA_DIR:./media}
app.docs-public=${DOCS_PUBLIC:false}
app.cors-origins=${CORS_ORIGINS:}
springdoc.swagger-ui.csrf.enabled=false
springdoc.swagger-ui.persist-authorization=false
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
# SSE publico: una instancia de backend; avisos agrupados en memoria.
app.sse.max-clients=${SSE_MAX_CLIENTS:100}
app.sse.timeout-ms=${SSE_TIMEOUT_MS:300000}
app.sse.heartbeat-ms=${SSE_HEARTBEAT_MS:15000}
app.sse.dispatch-ms=${SSE_DISPATCH_MS:250}
# Solo para rotacion explicita desde el servidor.
app.admin.update-on-start=${ADMIN_UPDATE_ON_START:false}

